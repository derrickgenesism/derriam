<!DOCTYPE html>
<html>
<head>
  <title>Snake Game</title>
  <style>
    body {
      background-color: #222;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: sans-serif;
      margin-top: 50px;
    }
    canvas {
      background-color: #000;
      border: 2px solid #4CAF50;
      box-shadow: 0 0 10px #4CAF50;
    }
    #score {
      font-size: 24px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div id="score">Score: 0</div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <p>Use Arrow Keys to move.</p>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const gridSize = 20;
    let snake = [{x: 200, y: 200}];
    let food = {x: 100, y: 100};
    let dx = gridSize;
    let dy = 0;
    let score = 0;
    let gameLoopTimeout;

    function main() {
      if (hasGameEnded()) {
        ctx.fillStyle = "red";
        ctx.font = "30px Arial";
        ctx.fillText("Game Over!", 120, 200);
        return;
      }
      gameLoopTimeout = setTimeout(function onTick() {
        clearCanvas();
        drawFood();
        advanceSnake();
        drawSnake();
        main();
      }, 100);
    }

    function clearCanvas() {
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawSnake() {
      snake.forEach(drawSnakePart);
    }

    function drawSnakePart(snakePart) {
      ctx.fillStyle = "lightgreen";
      ctx.strokeStyle = "darkgreen";
      ctx.fillRect(snakePart.x, snakePart.y, gridSize, gridSize);
      ctx.strokeRect(snakePart.x, snakePart.y, gridSize, gridSize);
    }

    function advanceSnake() {
      const head = {x: snake[0].x + dx, y: snake[0].y + dy};
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById("score").innerHTML = "Score: " + score;
        generateFood();
      } else {
        snake.pop();
      }
    }

    function generateFood() {
      food.x = Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize;
      food.y = Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize;
      snake.forEach(function has_snake_eaten_food(part) {
        if (part.x === food.x && part.y === food.y) generateFood();
      });
    }

    function drawFood() {
      ctx.fillStyle = "red";
      ctx.strokeStyle = "darkred";
      ctx.fillRect(food.x, food.y, gridSize, gridSize);
      ctx.strokeRect(food.x, food.y, gridSize, gridSize);
    }

    function hasGameEnded() {
      for (let i = 4; i < snake.length; i++) {
        if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
      }
      const hitLeftWall = snake[0].x < 0;
      const hitRightWall = snake[0].x >= canvas.width;
      const hitToptWall = snake[0].y < 0;
      const hitBottomWall = snake[0].y >= canvas.height;
      return hitLeftWall || hitRightWall || hitToptWall || hitBottomWall;
    }

    document.addEventListener("keydown", changeDirection);

    function changeDirection(event) {
      // Prevent default scrolling for arrow keys
      if([37, 38, 39, 40].indexOf(event.keyCode) > -1) {
          event.preventDefault();
      }
      const LEFT_KEY = 37;
      const RIGHT_KEY = 39;
      const UP_KEY = 38;
      const DOWN_KEY = 40;
      const keyPressed = event.keyCode;
      const goingUp = dy === -gridSize;
      const goingDown = dy === gridSize;
      const goingRight = dx === gridSize;
      const goingLeft = dx === -gridSize;
      if (keyPressed === LEFT_KEY && !goingRight) { dx = -gridSize; dy = 0; }
      if (keyPressed === UP_KEY && !goingDown) { dx = 0; dy = -gridSize; }
      if (keyPressed === RIGHT_KEY && !goingLeft) { dx = gridSize; dy = 0; }
      if (keyPressed === DOWN_KEY && !goingUp) { dx = 0; dy = gridSize; }
    }

    generateFood();
    main();
  </script>
</body>
</html>
